<!DOCTYPE html>
<html lang="ru">
<head>

    <style>

        .badge { display: inline-block; background: #F8E5EB; color: #B83B5E; padding: 4px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 12px; }

        p { color: #6B5B57; line-height: 1.5; margin-bottom: 24px; }
        .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a { text-decoration: none; padding: 12px 22px; border-radius: 8px; font-weight: bold; font-size: 15px; }
        .btn-main { background: #B83B5E; color: #FFFFFF; }
        .btn-sec { border: 1px solid #E5D7D0; color: #241B19; }

</head>

    <div class="err-card">

        <div class="btns">
